# Code generation configuration for the retail Tekken 6 Xbox 360 XEX.
# Supports Title ID 4E4D07E6 (World / Multi-language release: En,Ja,Fr,De,Es,It,Ko,Ru)

# Callback loaded from a 20-byte record and dispatched through CTR.
indirect_calls = [0x82390788]

[rexcrt]
memcpy = 0x826A1130
memset = 0x826A03B0

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
# Share register context across guest calls and tail calls.
non_argument_as_local = false
non_volatile_as_local = false

# Yield at the startup queue wait's backward branch to prevent thread starvation on iOS
[[midasm_hook]]
address = 0x8251C1FC
name = "Tekken6StartupWait"
registers = ["r11"]

# Allow the iOS launcher to select the guest's internal 3D render size (e.g. 720p, 1080p, Retina scale)
# These run before the two guest stores that initialize/reset 1024x576.
[[midasm_hook]]
address = 0x82219DB4
name = "ApplyTekkenInternalResolution"
registers = ["r11", "r10"]

[[midasm_hook]]
address = 0x82219A28
name = "ApplyTekkenInternalResolution"
registers = ["r11", "r10"]

# The offscreen target is resource 0x20000004, initialized at 1024x1024.
# The launcher can lower or scale it while leaving all other guest resources unchanged.
[[midasm_hook]]
address = 0x821AB410
name = "ApplyTekkenOffscreenResolution"
registers = ["r3", "r4", "r5"]

