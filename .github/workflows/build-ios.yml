name: Build Tekken 6 iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      xex_url:
        description: 'Direct download URL for Tekken 6 default.xex or zip containing it (optional)'
        required: false
        type: string
      release_tag:
        description: 'Release tag to publish (default: v1.0.0-ios)'
        required: false
        type: string
        default: 'v1.0.0-ios'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build Tekken 6 iOS (arm64)
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools (CMake, Ninja)
        run: |
          brew install cmake ninja

      - name: Select Xcode 16+ (for C++23 support)
        run: |
          for xcode_path in /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xcode_path" ]; then
              echo "Selecting $xcode_path"
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          xcodebuild -version

      - name: Prepare ReXGlue SDK for iOS
        run: |
          python3 tools/ios/prepare_sdk.py

      - name: Fetch default.xex from input URL (if provided)
        env:
          INPUT_XEX_URL: ${{ inputs.xex_url }}
        run: |
          if [ -n "$INPUT_XEX_URL" ]; then
            echo "Downloading executable from $INPUT_XEX_URL..."
            mkdir -p game
            curl -L -o game/downloaded_file "$INPUT_XEX_URL"
            if file game/downloaded_file | grep -qi 'zip'; then
              unzip -o game/downloaded_file -d game/
              rm game/downloaded_file
              find game -iname "default.xex" -exec mv {} game/default.xex \;
            else
              mv game/downloaded_file game/default.xex
            fi
          fi

      - name: Generate Game Code (if default.xex present)
        run: |
          if [ -f "game/default.xex" ]; then
            echo "Found game/default.xex! Generating native C++ source code..."
            python3 tools/ios/generate_code.py
          elif [ -f "src/recompiled/sources.cmake" ]; then
            echo "Found pre-generated guest code in src/recompiled/!"
          else
            echo "Notice: game/default.xex not found. Building host probe/harness IPA."
            mkdir -p ios/generated/default
          fi

      - name: Configure CMake (iOS Preset)
        run: |
          cd ios
          cmake --preset ios

      - name: Build Tekken6.ipa
        run: |
          cd ios
          cmake --build --preset ios --target ipa

      - name: Find Output IPA
        id: find_ipa
        run: |
          IPA_PATH=$(find ios -name "Tekken6.ipa" -type f | head -n 1)
          if [ -n "$IPA_PATH" ] && [ -f "$IPA_PATH" ]; then
            echo "Found IPA at: $IPA_PATH"
            echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "Looking for Tekken6.app bundle..."
            APP_PATH=$(find ios -name "Tekken6.app" -type d | head -n 1)
            if [ -n "$APP_PATH" ]; then
              mkdir -p ios/Payload
              cp -R "$APP_PATH" ios/Payload/
              cd ios && zip -qr Tekken6.ipa Payload && cd ..
              echo "ipa_path=ios/Tekken6.ipa" >> "$GITHUB_OUTPUT"
            else
              echo "Error: No IPA or app bundle generated."
              exit 1
            fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tekken6-iOS-IPA
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && steps.find_ipa.outputs.ipa_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Tekken 6 iOS ${{ steps.release_info.outputs.tag }}"
          body: |
            ## Tekken 6 iOS Native Recompilation (ProMotion 120Hz Edition)
            
            ### Features:
            - **Native Apple Silicon ARM64 Execution:** ReXGlue static recompilation translated ahead-of-time.
            - **ProMotion 120Hz Support:** Enhanced touch responsiveness and buttery smooth presentation on iPhone 13 Pro+ / iPad Pro.
            - **Native Metal Rendering:** GPU translation via MoltenVK.
            - **Fighting Game Layout:** Full 8-direction D-pad, 4-button attack diamond (LP, RP, LK, RK), and quick macro triggers (1+2, 3+4, 1+3, 2+4).
            - **Controller Support:** Connect DualSense, Xbox Wireless, or MFi controllers via Bluetooth.
            
            ### Installation:
            1. Sideload `Tekken6.ipa` via **LiveContainer**, **SideStore**, or **TrollStore**.
            2. Place your legally dumped `Tekken 6 (World).iso` or game assets in the app's `Documents` folder via the iOS Files app.
            3. Launch and enjoy!
          files: ${{ steps.find_ipa.outputs.ipa_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
